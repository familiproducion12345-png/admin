<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Moto · Panel de administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
:root{--red:#E11931;--red2:#FF3B53;--redD:#9E071A;--tint:#FFF0F2;--ink:#0F0F14;--mut:#6E6E7A;--line:#E8E8ED;--bg:#F2F2F7;--card:#fff;--green:#18b25b;--amber:#F5A100;--blue:#0A63E8;--sh:0 6px 22px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

/* Login */
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(150deg,var(--red2),var(--redD))}
.lbox{background:#fff;border-radius:28px;padding:30px;width:min(400px,100%);box-shadow:0 30px 60px rgba(0,0,0,.25)}
.lbox h1{font-size:28px;font-weight:800;letter-spacing:-1px}
.lbox p{color:var(--mut);margin:4px 0 18px;font-weight:500}
.lbox label{display:block;font-weight:800;font-size:12px;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.lbox input{width:100%;border:2px solid transparent;background:#F7F7FA;border-radius:14px;padding:14px;outline:0;font-weight:600}
.lbox input:focus{border-color:var(--red);background:#fff}
.lerr{display:none;background:var(--tint);color:var(--redD);border:2px solid #FFC9CE;border-radius:14px;padding:12px;font-weight:700;margin-top:12px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-weight:800;transition:.2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-red{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;box-shadow:0 8px 18px -6px rgba(225,25,49,.5)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#F2F2F7;color:var(--ink)}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn-block{width:100%;margin-top:18px}

/* Layout */
#app{display:flex;min-height:100%}
.side{width:230px;flex:none;background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:22px;font-weight:800;letter-spacing:-.8px;padding:4px 10px 16px}
.brand span{color:var(--red2)}
.nav{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;font-weight:700;color:#B9B9C6;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:var(--red);color:#fff}
.nav .n{margin-left:auto;background:var(--red2);color:#fff;border-radius:10px;min-width:20px;text-align:center;font-size:11px;font-weight:800;padding:2px 6px}
.nav.on .n{background:#fff;color:var(--red)}
.who{margin-top:auto;padding:12px 10px 0;color:#9494A3;font-size:12px;font-weight:600;word-break:break-all}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.bar h1{font-size:26px;font-weight:800;letter-spacing:-.8px}
.sp{flex:1}
.banner{background:#FFF7E0;border:2px solid #FFE08A;color:#7A5500;border-radius:16px;padding:12px 16px;font-weight:700;margin-bottom:16px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.card h3{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh)}
.kpi small{display:block;color:var(--mut);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.hot b{color:var(--red)}
.kpi em{display:block;font-style:normal;color:var(--mut);font-size:12px;font-weight:600;margin-top:2px}
#hmap,.mapbox{width:100%;height:340px;border-radius:18px;overflow:hidden;background:#e9e9ee}
.mapbox{height:260px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:9px 14px;border-radius:20px;background:#fff;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.chip.on{background:var(--ink);color:#fff}
.search{width:100%;border:2px solid transparent;background:#fff;border-radius:16px;padding:13px 16px;outline:0;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:12px}
.search:focus{border-color:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#fff;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:pointer;text-align:left;width:100%}
.row:hover{box-shadow:0 6px 18px rgba(0,0,0,.09)}
.row.sel{outline:2px solid var(--red)}
.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:800}
.row small{display:block;color:var(--mut);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;flex:none}
.av{width:42px;height:42px;border-radius:15px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.badge{display:inline-block;padding:3px 9px;border-radius:9px;font-size:11px;font-weight:800;margin:3px 4px 0 0}
.b-red{background:var(--tint);color:var(--redD)}.b-green{background:#E9F8EF;color:#0E7A3D}.b-gray{background:#EEE;color:#555}.b-amber{background:#FFF3D6;color:#8A5A00}.b-blue{background:#E6F0FF;color:#0A4FB8}.b-dark{background:var(--ink);color:#fff}
.empty{color:var(--mut);font-weight:600;padding:16px;text-align:center}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(to top,var(--redD),var(--red2));min-height:4px}
.bars span{font-size:11px;color:var(--mut);font-weight:700}
.bars em{font-style:normal;font-size:11px;font-weight:800}

/* Panel lateral */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--bg);z-index:50;box-shadow:-20px 0 60px rgba(0,0,0,.25);overflow-y:auto;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
#pscrim{position:fixed;inset:0;background:rgba(10,10,14,.45);z-index:49;display:none}
.phead{display:flex;align-items:center;gap:14px;padding:20px;background:linear-gradient(150deg,var(--red2),var(--redD));color:#fff;position:relative}
.phead .avb{width:62px;height:62px;border-radius:22px;background:#fff;color:var(--red);display:grid;place-items:center;font-weight:800;font-size:26px;overflow:hidden;flex:none}
.phead .avb img{width:100%;height:100%;object-fit:cover}
.phead b{font-size:20px;font-weight:800;display:block}
.phead small{opacity:.9;font-weight:600;display:block}
.phead .x{position:absolute;top:12px;right:14px;color:#fff;font-size:20px;font-weight:800;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18)}
.phead .badge{background:rgba(255,255,255,.2);color:#fff}
.pbody{padding:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow:auto}
.tab{padding:10px 14px;border-radius:14px;font-weight:800;background:#fff;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kv div{background:#fff;border-radius:16px;padding:12px}
.kv small{display:block;color:var(--mut);font-size:11px;font-weight:800;text-transform:uppercase}
.kv b{display:block;font-size:17px;font-weight:800;margin-top:3px;word-break:break-word}
.note{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px}
.note b{font-weight:800}
.note p{margin-top:6px;line-height:1.45;font-weight:500}
.note small{color:var(--mut);font-weight:600}
.lock{background:var(--tint);border:2px solid #FFC9CE;color:var(--redD);border-radius:16px;padding:12px 14px;font-weight:700;margin-bottom:12px}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(10,10,14,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:24px;padding:22px;width:min(440px,100%);max-height:90vh;overflow:auto}
.mbox h3{font-size:19px;font-weight:800;margin-bottom:6px}
.mbox p{color:var(--mut);font-weight:500;line-height:1.45;margin-bottom:6px}
.mbox label{display:block;font-weight:800;font-size:12px;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.mbox input,.mbox select,.mbox textarea{width:100%;border:2px solid var(--line);background:#F7F7FA;border-radius:14px;padding:12px;outline:0;font-weight:600}
.mbox input:focus,.mbox select:focus,.mbox textarea:focus{border-color:var(--red);background:#fff}
.mact{display:flex;gap:10px;margin-top:18px}
.mact .btn{flex:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(15,15,20,.95);color:#fff;padding:13px 20px;border-radius:20px;font-weight:700;z-index:100;display:none;max-width:90vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.3)}

/* Soporte */
.sup{display:grid;grid-template-columns:320px 1fr;gap:16px;height:calc(100vh - 120px);min-height:420px}
.sup .lst{overflow:auto}
.chat{background:#fff;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh)}
.chat .ch{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chat .ch b{display:block;font-weight:800}
.chat .ch small{color:var(--mut);font-weight:600}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.m{max-width:78%;padding:10px 14px;border-radius:18px;font-weight:500;line-height:1.4;word-wrap:break-word}
.m small{display:block;font-size:11px;opacity:.65;margin-top:3px;font-weight:600}
.m.me{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:5px}
.m.ot{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}
.qr{display:flex;gap:8px;overflow:auto;padding:10px 14px;border-top:1px solid var(--line)}
.qr button{flex:none;background:var(--tint);color:var(--redD);font-weight:700;font-size:13px;padding:9px 14px;border-radius:18px}
.cin{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.cin input{flex:1;border:2px solid transparent;background:#F7F7FA;border-radius:22px;padding:12px 16px;outline:0;font-weight:600}
.cin input:focus{border-color:var(--red)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.back{display:none}
textarea.big{width:100%;border:2px solid var(--line);background:#F7F7FA;border-radius:16px;padding:14px;outline:0;font-weight:600;min-height:130px;resize:vertical}
textarea.big:focus{border-color:var(--red);background:#fff}

@media(max-width:900px){
  #app{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;z-index:40;flex-direction:row;overflow-x:auto;padding:10px;gap:6px;align-items:center}
  .brand,.who{display:none}
  .nav{width:auto;white-space:nowrap;padding:10px 14px}
  .main{padding:16px 14px 60px}
  .grid2{grid-template-columns:1fr}
  .sup{grid-template-columns:1fr;height:calc(100vh - 150px)}
  .sup.chatting .lst{display:none}
  .sup:not(.chatting) .chat{display:none}
  .back{display:inline-block}
}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="lform" novalidate>
    <h1>Moto <span style="color:var(--red)">Admin</span></h1>
    <p>Acceso exclusivo del administrador.</p>
    <label for="lm">Correo</label><input id="lm" type="email" autocomplete="email" placeholder="admin@correo.com">
    <label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="lerr" id="lerr"></div>
    <button class="btn btn-red btn-block" id="lgo" type="submit">Entrar al panel</button>
  </form>
</div>

<div id="app" hidden>
  <aside class="side">
    <div class="brand">Moto <span>Admin</span></div>
    <button class="nav on" data-act="nav" data-v="home">▣ Resumen</button>
    <button class="nav" data-act="nav" data-v="rides">➜ Viajes <span class="n" id="nRides" hidden></span></button>
    <button class="nav" data-act="nav" data-v="users">☻ Usuarios</button>
    <button class="nav" data-act="nav" data-v="apps">✔ Solicitudes <span class="n" id="nApps" hidden></span></button>
    <button class="nav" data-act="nav" data-v="support">✉ Soporte <span class="n" id="nSup" hidden></span></button>
    <button class="nav" data-act="nav" data-v="reports">⚑ Reportes</button>
    <button class="nav" data-act="nav" data-v="finance">$ Finanzas</button>
    <button class="nav" data-act="nav" data-v="broadcast">☰ Difusión</button>
    <button class="nav" data-act="nav" data-v="log">✎ Registro</button>
    <div class="who"><span id="whoM"></span><br><button class="btn btn-ghost btn-sm" style="margin-top:8px;background:rgba(255,255,255,.1);color:#fff" data-act="logout">Cerrar sesión</button></div>
  </aside>
  <main class="main">
    <div class="bar"><h1 id="vt">Resumen</h1><div class="sp"></div><button class="btn btn-ghost btn-sm" data-act="refresh">↻ Actualizar</button></div>
    <div id="banner" class="banner" hidden></div>
    <div id="view"></div>
  </main>
</div>

<div id="pscrim" data-act="close"></div>
<aside id="panel"></aside>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPABASE_URL='https://ixajhadihphpmhkllyvf.supabase.co';
const SUPABASE_KEY='sb_publishable__QS2fmX09RyOEg3LMatd1A_DbQutV4u';
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const CUR={COP:{loc:'es-CO',dec:0},USD:{loc:'en-US',dec:2}};
const money=(v,c)=>{c=c||'COP';const C=CUR[c]||CUR.COP;return new Intl.NumberFormat(C.loc,{style:'currency',currency:c,minimumFractionDigits:C.dec,maximumFractionDigits:C.dec}).format(+v||0)};
const ACTIVE=['searching','pickup','trip','pay'];
const ST={searching:['Buscando','b-amber'],pickup:['Recogida','b-blue'],trip:['En viaje','b-green'],pay:['Cobro','b-green'],done:['Completado','b-gray'],cancelled:['Cancelado','b-red']};
const CATS=['Mal trato al pasajero','Conducción peligrosa','Cobro indebido','Cancelaciones abusivas','Vehículo o documentos','Incumplimiento de normas','Otro'];
const SEV={baja:'b-gray',media:'b-amber',alta:'b-red'};
const RIDE_COLS='id,passenger_id,driver_id,status,label,km,fare,currency,commission,created_at,finished_at,cancelled_by,from_lat,from_lng,to_lat,to_lng';
const fmtT=t=>t?new Date(t).toLocaleString('es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const fmtD=t=>t?new Date(t).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'}):'—';
const sod=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const kmTxt=v=>(+v||0).toFixed(1)+' km';
const waLink=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===10)d='57'+d;return d?'https://wa.me/'+d:'#'};

const S={me:null,view:'home',apps:[],appF:'pending',appsReady:true,profiles:{},rides:[],stats:{},debts:{},pens:[],penBy:{},reports:[],sup:[],locs:{},log:[],avatars:{},drivers:new Set(),passengers:new Set(),
  rideF:'active',userF:'drivers',q:'',rq:'',supThread:null,supQ:'',err:null,homeBuilt:false,hmap:null,homeFit:false};
let P=null; /* panel abierto */

/* ---------- utilidades de UI ---------- */
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3600)}
function ask(o){return new Promise(res=>{
  const m=$('modal');
  m.innerHTML='<div class="mbox"><h3>'+esc(o.title)+'</h3>'+(o.body?'<p>'+o.body+'</p>':'')+
   (o.fields||[]).map(f=>'<label>'+esc(f.label)+'</label>'+(f.type==='select'?'<select id="f_'+f.id+'">'+f.options.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select>':f.type==='textarea'?'<textarea id="f_'+f.id+'" rows="4" placeholder="'+esc(f.ph||'')+'"></textarea>':'<input id="f_'+f.id+'" placeholder="'+esc(f.ph||'')+'">')).join('')+
   '<div class="mact"><button class="btn btn-ghost" id="m_no">Cancelar</button><button class="btn '+(o.danger?'btn-red':'btn-dark')+'" id="m_ok">'+esc(o.ok||'Aceptar')+'</button></div></div>';
  m.style.display='flex';
  const done=v=>{m.style.display='none';m.innerHTML='';res(v)};
  $('m_no').onclick=()=>done(null);
  m.onclick=e=>{if(e.target===m)done(null)};
  $('m_ok').onclick=()=>{const v={};for(const f of(o.fields||[])){v[f.id]=$('f_'+f.id).value.trim();if(f.req&&!v[f.id]){$('f_'+f.id).focus();toast(f.label+' es obligatorio');return}}done(v)};
  const first=m.querySelector('input,textarea,select');if(first)first.focus();
})}
const fnMissing=e=>!!e&&(e.code==='PGRST202'||/could not find the function|schema cache/i.test(e.message||''));
async function rpc(n,a){
  const r=await sb.rpc(n,a);
  if(r.error){const m=r.error.message||'';
    if(/RIDE_NOT_FOUND/.test(m))toast('Ese viaje ya no está activo');
    else{
      const full=[r.error.message,r.error.details,r.error.hint,r.error.code?'(código '+r.error.code+')':''].filter(Boolean).join(' · ');
      const hint=/NOT_ALLOWED/.test(m)?'No tienes permisos de administrador. Cierra sesión y entra de nuevo con el correo del administrador.':fnMissing(r.error)?'Falta instalar una función en Supabase (ejecutar el SQL).':'';
      ask({title:'No se pudo completar la acción',body:(hint?esc(hint)+'<br><br>':'')+'<b>Mensaje del servidor:</b><br><code style="word-break:break-all;display:block;margin-top:6px;background:#F7F7FA;padding:10px;border-radius:10px;color:#0F0F14">'+esc(full)+'</code><br>Si no sabes qué significa, envíale una captura de este mensaje a Claude.',ok:'Entendido'});
    }
    return null}
  return r;
}
const ava=n=>'<div class="av">'+esc((n||'?')[0].toUpperCase())+'</div>';
const badge=(t,c)=>'<span class="badge '+(c||'b-gray')+'">'+esc(t)+'</span>';
const nameOf=id=>id?(S.profiles[id]?S.profiles[id].name:'Usuario'):'—';

/* ---------- deuda ---------- */
function debtOf(uid){
  const o={COP:0,USD:0};
  Object.entries(S.debts[uid]||{}).forEach(([c,v])=>o[c]=(o[c]||0)+v);
  (S.penBy[uid]||[]).filter(p=>p.role==='driver').forEach(p=>o[p.currency]=(o[p.currency]||0)+ +p.amount);
  return o;
}
const hasDebt=o=>Object.values(o).some(v=>v>0);
const debtTxt=o=>{const t=Object.keys(o).filter(c=>o[c]>0).map(c=>money(o[c],c));return t.length?t.join(' + '):'$0'};
const legs=x=>{try{if(typeof x==='string')x=JSON.parse(x)}catch(e){x=null}return Array.isArray(x)?x.filter(c=>Array.isArray(c)&&c.length>=2):[]};

/* ---------- mapas ---------- */
const MSTYLE={version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]};
function mkMap(el){
  if(!window.maplibregl||!el)return null;
  const m=new maplibregl.Map({container:el,style:MSTYLE,center:[-74.07,4.71],zoom:11,attributionControl:{compact:true}});
  m.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  m._mk=[];m._q=[];m._ready=false;
  m.once('load',()=>{m._ready=true;m._q.forEach(f=>f());m._q=[]});
  return m;
}
const onMap=(m,f)=>{if(!m)return;m._ready?f():m._q.push(f)};
function clearMk(m){(m._mk||[]).forEach(x=>x.remove());m._mk=[]}
function dot(m,lng,lat,color,label,big){
  const d=document.createElement('div');
  const s=big?20:16;
  d.style.cssText='width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+color+';border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.4)';
  const mk=new maplibregl.Marker({element:d}).setLngLat([lng,lat]);
  if(label)mk.setPopup(new maplibregl.Popup({offset:14,closeButton:false}).setText(label));
  mk.addTo(m);m._mk.push(mk);return mk;
}
function drawRide(m,r,loc){
  if(!m||!r)return;
  onMap(m,()=>{
    clearMk(m);
    ['la','lb'].forEach(id=>{if(m.getLayer(id))m.removeLayer(id);if(m.getSource(id))m.removeSource(id)});
    const la=legs(r.leg_a);let lb=legs(r.leg_b);
    if(lb.length<2)lb=[[r.from_lng,r.from_lat],[r.to_lng,r.to_lat]];
    const pts=[];
    const add=(id,c,color,dash)=>{
      if(c.length<2)return;
      m.addSource(id,{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:c}}});
      const paint={'line-color':color,'line-width':5};if(dash)paint['line-dasharray']=[2,2];
      m.addLayer({id,type:'line',source:id,layout:{'line-cap':'round','line-join':'round'},paint});
      c.forEach(p=>pts.push(p));
    };
    add('la',la,'#0A63E8',true);add('lb',lb,'#E11931',false);
    dot(m,r.from_lng,r.from_lat,'#18b25b','Recogida');
    dot(m,r.to_lng,r.to_lat,'#0F0F14','Destino: '+(r.label||''));
    pts.push([r.from_lng,r.from_lat],[r.to_lng,r.to_lat]);
    if(loc&&loc.lat!=null){dot(m,loc.lng,loc.lat,'#E11931','Conductor ahora',true);pts.push([loc.lng,loc.lat])}
    const b=new maplibregl.LngLatBounds();pts.forEach(p=>b.extend(p));
    if(!b.isEmpty())m.fitBounds(b,{padding:50,duration:500,maxZoom:16});
  });
}

/* ---------- SOPORTE ---------- */
const supTs=m=>Date.parse(m.created_at);
const supKey=t=>'adm_seen_'+t;
const supSeen=t=>+(store.get(supKey(t))||0);
function supMark(t){const last=S.sup.filter(m=>m.thread_id===t).reduce((a,m)=>Math.max(a,supTs(m)),0);if(last)store.set(supKey(t),last)}
function supUnread(){const by={};S.sup.forEach(m=>{if(!m.from_admin&&supTs(m)>supSeen(m.thread_id))by[m.thread_id]=1});return Object.keys(by).length}
const QUICK=['Hola, ¿en qué te puedo ayudar?','Ya revisé tu caso, dame un momento','Te quité la deuda, ya puedes conectarte','Envíame el comprobante de pago','Tu cuenta fue desbloqueada'];
function renderSupport(){
  const v=$('view'),keep=$('sIn')?$('sIn').value:'',hadFocus=document.activeElement&&document.activeElement.id==='sIn';
  const by={};S.sup.forEach(m=>(by[m.thread_id]=by[m.thread_id]||[]).push(m));
  let ids=Object.keys(by).sort((a,b)=>supTs(by[b][by[b].length-1])-supTs(by[a][by[a].length-1]));
  if(S.supThread&&!by[S.supThread])ids.unshift(S.supThread);
  const q=S.supQ.toLowerCase();if(q)ids=ids.filter(id=>nameOf(id).toLowerCase().includes(q));
  const list=ids.length?ids.map(id=>{const l=by[id]?by[id][by[id].length-1]:null,un=l&&!l.from_admin&&supTs(l)>supSeen(id);
    return '<button class="row'+(S.supThread===id?' sel':'')+'" data-act="thread" data-id="'+id+'">'+ava(nameOf(id))+'<div class="t"><b>'+esc(nameOf(id))+'</b><small>'+(l?(l.from_admin?'Tú: ':'')+esc(l.text):'Sin mensajes')+'</small></div>'+(un?'<i class="dot"></i>':'')+'</button>'}).join(''):'<div class="empty">Aún no hay conversaciones.</div>';
  let chat='<div class="chat"><div class="empty" style="margin:auto">Elige una conversación</div></div>';
  if(S.supThread){
    const id=S.supThread,msgs=by[id]||[];
    chat='<div class="chat"><div class="ch"><button class="btn btn-ghost btn-sm back" data-act="supback">←</button>'+ava(nameOf(id))+'<div style="flex:1"><b>'+esc(nameOf(id))+'</b><small>'+esc((S.profiles[id]||{}).phone||'')+'</small></div><button class="btn btn-ghost btn-sm" data-act="user" data-id="'+id+'">Perfil</button></div>'+
      '<div class="msgs" id="sMsgs">'+(msgs.length?msgs.map(m=>'<div class="m '+(m.from_admin?'me':'ot')+'">'+esc(m.text)+'<small>'+fmtT(m.created_at)+'</small></div>').join(''):'<div class="empty">Escribe para iniciar la conversación.</div>')+'</div>'+
      '<div class="qr">'+QUICK.map(t=>'<button data-act="quick" data-t="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div>'+
      '<div class="cin"><input id="sIn" placeholder="Escribe tu respuesta…" maxlength="1000" autocomplete="off"><button class="btn btn-red" data-act="ssend">Enviar</button></div></div>';
  }
  v.innerHTML='<div class="sup'+(S.supThread?' chatting':'')+'"><div class="lst"><input class="search" id="sq" placeholder="Buscar conductor…" value="'+esc(S.supQ)+'">'+list+'</div>'+chat+'</div>';
  $('sq').oninput=e=>{S.supQ=e.target.value;renderSupport();const s=$('sq');s.focus();s.setSelectionRange(s.value.length,s.value.length)};
  if(S.supThread){const M=$('sMsgs');M.scrollTop=M.scrollHeight;const i=$('sIn');i.value=keep;i.onkeydown=e=>{if(e.key==='Enter')sendSup(i.value)};if(hadFocus)i.focus()}
}
function openThread(id){
  closePanel();S.supThread=id;S.view='support';
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v==='support'));
  $('vt').textContent=TITLES.support;supMark(id);render(true);
}
async function sendSup(text){
  text=(text||'').trim();if(!text||!S.supThread)return;
  const i=$('sIn');if(i)i.value='';
  const{data,error}=await sb.from('support_messages').insert({thread_id:S.supThread,sender_id:S.me.id,from_admin:true,text:text.slice(0,1000)}).select().single();
  if(error){toast(fnMissing(error)?'Falta ejecutar admin_setup.sql':'No se pudo enviar el mensaje');if(i)i.value=text;return}
  supIncoming(data);
}
function supIncoming(row){
  if(!row||S.sup.some(m=>m.id===row.id))return;
  S.sup.push(row);S.sup.sort((a,b)=>supTs(a)-supTs(b));
  const viewing=S.view==='support'&&S.supThread===row.thread_id;
  if(viewing)supMark(row.thread_id);
  else if(!row.from_admin){toast('Mensaje de '+nameOf(row.thread_id)+': '+row.text.slice(0,40));if(navigator.vibrate)navigator.vibrate(150)}
  if(S.view==='support')renderSupport();
  navBadges();
}

/* ---------- eventos ---------- */
const A={
  nav:d=>{closePanel();go(d.v)},
  user:d=>openUser(d.id,d.tab),
  ride:d=>openRide(d.id),
  close:()=>closePanel(),
  utab:d=>{P.tab=d.t;renderUser()},
  sel:d=>selRide(d.id),
  block:d=>doBlock(d.id),
  clear:d=>doClear(d.id),
  cancel:d=>doCancel(d.id),
  report:d=>doReport(d.id,d.ride),
  delrep:d=>doDelRep(d.id),
  settle:d=>doSettle(d.id),
  chat:d=>openThread(d.id),
  rf:d=>{S.rideF=d.f;renderRides()},
  uf:d=>{S.userF=d.f;renderUsers()},
  app:d=>openApp(d.id),
  af:d=>{S.appF=d.f;renderApps()},
  approve:d=>doReview(d.id,true),
  reject:d=>doReview(d.id,false),
  thread:d=>{S.supThread=d.id;supMark(d.id);renderSupport();navBadges()},
  supback:()=>{S.supThread=null;renderSupport()},
  quick:d=>{const i=$('sIn');if(i){i.value=d.t;i.focus()}},
  ssend:()=>{const i=$('sIn');if(i)sendSup(i.value)},
  bsend:()=>doBroadcast(),
  refresh:async()=>{await loadAll();render(false);toast('Datos actualizados')},
  logout:async()=>{try{await sb.auth.signOut()}catch(e){}location.reload()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){if(el.tagName==='A')return;f(el.dataset,el,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modal').style.display==='flex')$('m_no')&&$('m_no').click();else closePanel()}});

/* ---------- sesión ---------- */
function lerr(m){const e=$('lerr');e.textContent=m;e.style.display=m?'block':'none'}
async function enter(user){
  const r=await sb.rpc('is_admin');
  if(r.error||r.data!==true){await sb.auth.signOut();lerr(r.error&&fnMissing(r.error)?'Falta ejecutar admin_setup.sql en Supabase.':'Esta cuenta no tiene permisos de administrador.');$('login').hidden=false;$('app').hidden=true;return false}
  S.me=user;$('whoM').textContent=user.email;$('login').hidden=true;$('app').hidden=false;
  await loadAll();go('home');startLive();return true;
}
$('lform').onsubmit=async e=>{
  e.preventDefault();lerr('');
  if(!sb){lerr('No pudimos conectar con el servidor.');return}
  const email=$('lm').value.trim(),password=$('lp').value;
  if(!email||!password){lerr('Ingresa correo y contraseña.');return}
  const b=$('lgo');b.disabled=true;b.textContent='Entrando…';
  const{data,error}=await sb.auth.signInWithPassword({email,password});
  if(error)lerr(/invalid login/i.test(error.message)?'Correo o contraseña incorrectos.':error.message);
  else await enter(data.user);
  b.disabled=false;b.textContent='Entrar al panel';$('lp').value='';
};
let liveCh=null,softT=null,pollT=null;
function soft(){clearTimeout(softT);softT=setTimeout(async()=>{await loadAll();if(S.view!=='support')render(false)},1200)}
function startLive(){
  if(liveCh)return;
  liveCh=sb.channel('admin-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'rides'},soft)
    .on('postgres_changes',{event:'*',schema:'public',table:'driver_applications'},soft)
    .on('postgres_changes',{event:'*',schema:'public',table:'driver_locations'},p=>{if(p.new&&p.new.ride_id){S.locs[p.new.ride_id]=p.new;if(S.view==='home')updateHomeMap()}})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages'},p=>p.new&&supIncoming(p.new))
    .subscribe();
  pollT=setInterval(async()=>{if(document.hidden||$('modal').style.display==='flex')return;await loadAll();if(S.view!=='support'&&S.view!=='broadcast')render(false)},20000);
}
(async()=>{
  if(!sb){lerr('No pudimos cargar el servidor. Revisa tu internet.');return}
  try{const{data}=await sb.auth.getSession();if(data&&data.session)await enter(data.session.user)}catch(e){}
})();
</script>
</body>
